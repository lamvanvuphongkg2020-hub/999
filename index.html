<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Wishes ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #fff5f8 0%, #ffeef4 50%, #f9f2ff 100%);
      color: #5a3a4a;
      padding: 20px 14px 48px;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }
    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floating-heart {
      position: absolute;
      bottom: -30px;
      color: #ff7eb3;
      opacity: 0;
      animation: floatHeart linear infinite;
      user-select: none;
    }
    @keyframes floatHeart {
      0% {
        transform: translateY(0) translateX(0) scale(0.85) rotate(-6deg);
        opacity: 0;
      }
      20% {
        opacity: 0.42;
      }
      50% {
        transform: translateY(-50vh) translateX(12px) scale(1) rotate(6deg);
        opacity: 0.35;
      }
      100% {
        transform: translateY(-106vh) translateX(-10px) scale(1.05) rotate(-6deg);
        opacity: 0;
      }
    }
    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }
    .header-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #ffd6e5;
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 8px 24px rgba(235, 140, 175, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #b84a76;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header-date {
      font-size: 12px;
      color: #9e6b82;
      font-weight: 500;
      background: #fff0f6;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid #ffd9e8;
    }
    .daily-alert-banner {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ffb8d3;
      border-left: 4px solid #ff5e9c;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #6b364d;
      box-shadow: 0 6px 18px rgba(235, 140, 175, 0.16);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .daily-alert-banner.show {
      display: flex;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ffd6e5;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 6px 18px rgba(235, 140, 175, 0.1);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #b84a76;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .wish-box {
      background: #fff7fa;
      border: 1px dashed #f7bfd4;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #5c3749;
      min-height: 68px;
      display: flex;
      align-items: center;
    }
    button {
      font-family: inherit;
      border: none;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eb3, #ff5e9c);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 94, 156, 0.25);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    button:active:not(:disabled) {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    button.secondary {
      background: #fff0f6;
      color: #b84a76;
      border: 1px solid #ffc9df;
      box-shadow: none;
      padding: 6px 11px;
      font-size: 11px;
    }
    button.music-on {
      background: #ffe3ef;
      color: #b52d68;
      border-color: #ff9ec4;
    }
    .streak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .streak-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .streak-text {
      font-size: 13px;
      color: #5a3a4a;
    }
    .streak-text strong {
      color: #d63f7d;
      font-size: 16px;
    }
    .streak-sub {
      font-size: 11px;
      color: #9e6b82;
      margin-top: 6px;
    }
    .plan-form {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="text"],
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: #4f2f3f;
      background: #fff9fb;
      border: 1px solid #ffd1e3;
      border-radius: 12px;
      padding: 9px 12px;
      outline: none;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: #ff7eb3;
      background: #fff;
    }
    textarea {
      min-height: 76px;
      resize: vertical;
      margin-bottom: 10px;
    }
    .plan-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .plan-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff8fb;
      border: 1px solid #ffe0ec;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .plan-item.completed span {
      text-decoration: line-through;
      opacity: 0.6;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(65, 25, 45, 0.38);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.open {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      border: 1px solid #ffd4e5;
      box-shadow: 0 14px 36px rgba(180, 70, 115, 0.22);
      text-align: center;
    }
    .modal-box h3 {
      font-size: 16px;
      color: #b84a76;
      margin-bottom: 10px;
    }
    .modal-box p {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
      color: #5a3a4a;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .wheel-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 8px auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      z-index: 3;
      color: #d63f7d;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .wheel-disc {
      width: 196px;
      height: 196px;
      border-radius: 50%;
      border: 5px solid #ff8ab8;
      background: conic-gradient(
        #ffe3ef 0deg 90deg,
        #f3e8ff 90deg 180deg,
        #fff0c2 180deg 270deg,
        #dff7ec 270deg 360deg
      );
      box-shadow: 0 10px 24px rgba(214, 63, 125, 0.2);
      transition: transform 2.8s cubic-bezier(0.18, 0.89, 0.32, 1);
      position: relative;
    }
    .wheel-center {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #ff6ea8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #b84a76;
      z-index: 2;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body>
  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <div class="container">
    <div class="header-card">
      <div class="header-title">Daily Wishes ♡</div>
      <div class="header-right">
        <button class="secondary" id="musicToggleBtn" type="button">🎵 Nhạc nền: Tắt</button>
        <div class="header-date" id="today"></div>
      </div>
    </div>

    <div class="daily-alert-banner" id="dailyAlertBanner">
      <div id="dailyAlertText"></div>
      <button class="secondary" id="dismissAlertBtn" type="button">Đã rõ ♡</button>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Lời chúc mỗi ngày</span>
        <button class="secondary" id="todayWishBtn" type="button">Thông điệp hôm nay ✨</button>
      </div>
      <div class="wish-box" id="wish"></div>
    </div>

    <div class="card">
      <div class="card-title"><span>Điểm danh tháng</span></div>
      <div class="streak-row">
        <div class="streak-text">
          Đã điểm danh: <strong id="streakCount">0</strong> / <span id="totalDaysInMonth">30</span> ngày
        </div>
        <div class="streak-actions">
          <button id="checkInBtn" type="button">Điểm danh hôm nay ✓</button>
          <button id="claimRewardBtn" type="button" style="display: none;">Vòng quay cuối tháng 🎡</button>
        </div>
      </div>
      <div class="streak-sub" id="attendanceTodayStatus">Bấm "Điểm danh hôm nay" để ghi nhận ngày hôm nay nhé.</div>
    </div>

    <div class="card">
      <div class="card-title"><span>Kế hoạch tuần này</span></div>
      <div class="plan-form">
        <input type="text" id="planTitleInput" placeholder="Thêm một việc nhỏ xinh cho tuần..." />
        <button id="addPlanBtn" type="button">Thêm</button>
      </div>
      <div class="plan-list" id="planList"></div>
    </div>

    <div class="card">
      <div class="card-title"><span>Gửi tâm sự & nguyện vọng</span></div>
      <textarea id="wishNoteInput" placeholder="Hôm nay bạn muốn nhắn gửi điều gì..."></textarea>
      <button id="sendAdminBtn" type="button">Gửi tâm sự ♡</button>
    </div>
  </div>

  <div class="modal" id="rewardModal">
    <div class="modal-box">
      <h3>Vòng quay quà cuối tháng 🎉</h3>
      <div class="wheel-wrap">
        <div class="wheel-pointer">▼</div>
        <div class="wheel-disc" id="wheelDisc"></div>
        <div class="wheel-center">♡</div>
      </div>
      <p id="rewardResultText">Đã tới cuối tháng rồi, bấm quay để nhận quà nhé!</p>
      <div class="modal-actions">
        <button id="spinRewardBtn" type="button">Quay ngay</button>
        <button class="secondary" id="closeRewardBtn" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://wnnpoinrdawukynhltnu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IUqPsueUh8rWjMjdjwC4BQ_cG7LSl6d';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const wishesList = [
      "Chúc bạn hôm nay luôn mỉm cười, gặp thật nhiều điều may mắn và bình yên. ♡",
      "Mong mọi điều tốt đẹp sẽ nhẹ nhàng tìm đến bạn, như nắng ghé qua ô cửa. 🌷",
      "Chúc bạn ăn ngon, ngủ ngoan, làm gì cũng thuận lợi và luôn được yêu thương.",
      "Mỗi ngày là một khởi đầu mới. Chúc bạn luôn tin vào những điều tốt đẹp phía trước."
    ];

    const rewardsPool = [
      "🧋 Một ly trà sữa size lớn theo sở thích!",
      "💸 Tiền lì xì / thưởng 10k cute!",
      "🍨 Một phần kem hoặc đồ ăn vặt chiều nay!",
      "💌 Một voucher 'được miễn làm việc nhà / được chiều hết nấc' 1 ngày!"
    ];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function getMonthContext() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return {
        dateString: `${year}-${month}-${day}`,
        displayDate: `${day}/${month}/${year}`,
        timeString: now.toISOString(),
        monthPrefix: `${year}-${month}-`,
        localKey: `daily_wishes_attendance_${year}_${month}`,
        daysInMonth: new Date(year, now.getMonth() + 1, 0).getDate()
      };
    }

    function readJsonSafe(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function writeJsonSafe(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }

    // 1. Khóa thông điệp 1 ngày 1 lần & không trùng lặp
    const LOCKED_WISH_KEY = 'dw_locked_wish_by_day';
    const USED_WISH_KEY = 'dw_used_wish_indices';

    function pickUniqueWishIndex() {
      let used = readJsonSafe(USED_WISH_KEY, []);
      if (!Array.isArray(used)) used = [];
      used = used.filter((i) => Number.isInteger(i) && i >= 0 && i < wishesList.length);

      let pool = wishesList.map((_, i) => i).filter((i) => !used.includes(i));
      if (!pool.length) {
        used = [];
        pool = wishesList.map((_, i) => i);
      }
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      used.push(chosen);
      writeJsonSafe(USED_WISH_KEY, used);
      return chosen;
    }

    function showDailyWish() {
      const el = document.getElementById("wish");
      const btn = document.getElementById("todayWishBtn");
      if (!el) return;

      const { dateString } = getMonthContext();
      const map = readJsonSafe(LOCKED_WISH_KEY, {});
      let idx = map[dateString];

      if (!Number.isInteger(idx) || idx < 0 || idx >= wishesList.length) {
        idx = pickUniqueWishIndex();
        map[dateString] = idx;
        writeJsonSafe(LOCKED_WISH_KEY, map);
      }

      el.textContent = wishesList[idx];
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Đã khóa hôm nay 🔒";
      }
    }

    // 2. Nhạc nền dịu êm — phát trọn vẹn nguyên 1 bài: Công Chúa Bông Bống
    let audioCtx = null;
    let musicTimeout = null;
    let noteStep = 0;
    let musicOn = localStorage.getItem('dw_music_on') === 'true';

    const NOTE_FREQ = {
      C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
      C4: 261.63, 'C#4': 277.18, D4: 293.66, 'D#4': 311.13, E4: 329.63, F4: 349.23, 'F#4': 369.99,
      G4: 392.00, 'G#4': 415.30, A4: 440.00, 'A#4': 466.16, B4: 493.88,
      C5: 523.25, 'C#5': 554.37, D5: 587.33, 'D#5': 622.25, E5: 659.25, F5: 698.46, 'F#5': 739.99,
      G5: 783.99, 'G#5': 830.61, A5: 880.00, B5: 987.77,
      C6: 1046.50
    };

    // Chuỗi nốt liền mạch nguyên bài "Công Chúa Bông Bống" (mỗi mục: [nốt_chính, nốt_bè_hoặc_null, thời_lượng_giây, nghỉ_ms])
    const fullBongBongSong = [
      // --- PHẦN 1: MỞ ĐẦU NHẸ NHÀNG ---
      ['E4', 'C4', 0.42, 340], ['G4', 'E4', 0.42, 340], ['A4', 'F4', 0.45, 360], ['G4', 'E4', 0.55, 450],
      ['E4', 'C4', 0.42, 340], ['D4', 'B3', 0.42, 340], ['C4', 'G3', 0.65, 520], ['D4', 'A3', 0.42, 340],
      ['E4', 'C4', 0.42, 340], ['F4', 'D4', 0.42, 340], ['G4', 'E4', 0.45, 360], ['A4', 'F4', 0.42, 340],
      ['G4', 'E4', 0.42, 340], ['E4', 'C4', 0.45, 360], ['D4', 'G3', 0.70, 560], ['REST', null, 0.25, 220],

      // --- PHẦN 2: ĐOẠN 1 - CÔNG CHÚA BÔNG BỐNG ---
      ['G4', 'E4', 0.40, 320], ['A4', 'F4', 0.40, 320], ['C5', 'G4', 0.48, 380], ['C5', 'G4', 0.42, 340],
      ['A4', 'F4', 0.42, 340], ['G4', 'E4', 0.42, 340], ['E4', 'C4', 0.55, 440], ['G4', 'D4', 0.40, 320],
      ['A4', 'F4', 0.40, 320], ['G4', 'E4', 0.42, 340], ['E4', 'C4', 0.42, 340], ['D4', 'B3', 0.42, 340],
      ['C4', 'G3', 0.45, 360], ['D4', 'A3', 0.45, 360], ['E4', 'C4', 0.72, 580], ['REST', null, 0.25, 220],

      // --- PHẦN 3: TIẾP NỐI ĐOẠN 1 ---
      ['A4', 'F4', 0.40, 320], ['C5', 'A4', 0.42, 340], ['D5', 'B4', 0.48, 380], ['C5', 'G4', 0.42, 340],
      ['A4', 'F4', 0.42, 340], ['G4', 'E4', 0.42, 340], ['F4', 'D4', 0.45, 360], ['E4', 'C4', 0.45, 360],
      ['D4', 'B3', 0.42, 340], ['E4', 'C4', 0.42, 340], ['G4', 'E4', 0.45, 360], ['A4', 'F4', 0.42, 340],
      ['G4', 'D4', 0.45, 360], ['F4', 'D4', 0.42, 340], ['D4', 'G3', 0.45, 360], ['C4', 'C3', 0.78, 640],

      // --- PHẦN 4: ĐIỆP KHÚC RỘN RÀNG ---
      ['C5', 'G4', 0.42, 330], ['E5', 'C5', 0.45, 360], ['D5', 'B4', 0.42, 330], ['C5', 'A4', 0.42, 330],
      ['A4', 'F4', 0.45, 360], ['C5', 'A4', 0.42, 330], ['G4', 'E4', 0.65, 520], ['E4', 'C4', 0.40, 320],
      ['G4', 'E4', 0.42, 340], ['A4', 'F4', 0.42, 340], ['B4', 'G4', 0.42, 340], ['C5', 'A4', 0.45, 360],
      ['D5', 'B4', 0.42, 340], ['B4', 'G4', 0.42, 340], ['G4', 'D4', 0.72, 580], ['REST', null, 0.25, 220],

      // --- PHẦN 5: CAO TRÀO & BIẾN TẤU ---
      ['E5', 'C5', 0.42, 330], ['F5', 'D5', 0.42, 330], ['E5', 'C5', 0.45, 360], ['D5', 'B4', 0.42, 330],
      ['C5', 'A4', 0.45, 360], ['A4', 'F4', 0.42, 330], ['G4', 'E4', 0.45, 360], ['A4', 'F4', 0.42, 330],
      ['G4', 'E4', 0.42, 330], ['F4', 'D4', 0.42, 330], ['E4', 'C4', 0.45, 360], ['D4', 'B3', 0.42, 330],
      ['F#4', 'D4', 0.40, 320], ['G4', 'E4', 0.48, 380], ['A4', 'F4', 0.42, 330], ['G4', 'D4', 0.70, 560],

      // --- PHẦN 6: HỒI KẾT DỊU ÊM ---
      ['C5', 'G4', 0.42, 340], ['A4', 'F4', 0.42, 340], ['G4', 'E4', 0.45, 360], ['E4', 'C4', 0.45, 360],
      ['F4', 'D4', 0.42, 340], ['E4', 'C4', 0.42, 340], ['D4', 'B3', 0.45, 360], ['C4', 'G3', 0.45, 360],
      ['D4', 'A3', 0.42, 340], ['E4', 'C4', 0.45, 360], ['G4', 'E4', 0.48, 380], ['E4', 'C4', 0.50, 400],

    function syncMusicBtn() {
      const btn = document.getElementById("musicToggleBtn");
      if (!btn) return;
      if (musicOn) {
        btn.textContent = "🎵 Công Chúa Bông Bống";
        btn.classList.add("music-on");
      } else {
        btn.textContent = "🎵 Nhạc nền: Tắt";
        btn.classList.remove("music-on");
      }
    }

    function playSongStep(stepData) {
      if (!audioCtx || audioCtx.state !== 'running' || !stepData) return;
      const [mainNote, harmonyNote, durationSec] = stepData;
      if (!mainNote || mainNote === 'REST') return;

      const mainFreq = NOTE_FREQ[mainNote];
      if (!mainFreq) return;

      const now = audioCtx.currentTime;
      const mainOsc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      mainOsc.type = 'sine';
      mainOsc.frequency.setValueAtTime(mainFreq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.03, now + 0.045);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

      mainOsc.connect(gain);

      if (harmonyNote && NOTE_FREQ[harmonyNote]) {
        const harmOsc = audioCtx.createOscillator();
        const harmGain = audioCtx.createGain();
        harmOsc.type = 'triangle';
        harmOsc.frequency.setValueAtTime(NOTE_FREQ[harmonyNote], now);
        harmGain.gain.setValueAtTime(0.0001, now);
        harmGain.gain.exponentialRampToValueAtTime(0.015, now + 0.05);
        harmGain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);
        harmOsc.connect(harmGain);
        harmGain.connect(audioCtx.destination);
        harmOsc.start(now);
        harmOsc.stop(now + durationSec + 0.03);
      }

      gain.connect(audioCtx.destination);
      mainOsc.start(now);
      mainOsc.stop(now + durationSec + 0.03);
    }

    function playFullSongStep() {
      if (!musicOn) return;
      const stepData = fullBongBongSong[noteStep];
      playSongStep(stepData);

      const gapMs = stepData ? stepData[3] : 360;
      noteStep += 1;

      if (noteStep >= fullBongBongSong.length) {
        noteStep = 0;
      }

      musicTimeout = setTimeout(() => {
        if (musicOn) playFullSongStep();
      }, gapMs);
    }

    async function enableMusic() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        if (musicTimeout) {
          clearTimeout(musicTimeout);
          musicTimeout = null;
        }
        noteStep = 0;
        musicOn = true;
        localStorage.setItem('dw_music_on', 'true');
        syncMusicBtn();
        playFullSongStep();
      } catch (_) {}
    }

    function disableMusic() {
      musicOn = false;
      localStorage.setItem('dw_music_on', 'false');
      if (musicTimeout) {
        clearTimeout(musicTimeout);
        musicTimeout = null;
      }
      syncMusicBtn();
    }

    const musicBtn = document.getElementById("musicToggleBtn");
    if (musicBtn) {
      syncMusicBtn();
      musicBtn.onclick = () => (musicOn ? disableMusic() : enableMusic());
    }
    document.addEventListener('pointerdown', () => {
      if (musicOn && (!audioCtx || audioCtx.state === 'suspended')) enableMusic();
    }, { once: true });

    // 3. Trái tim bay xung quanh
    function initHearts() {
      const layer = document.getElementById("heartsLayer");
      if (!layer) return;
      const icons = ['♡', '♥', '💕', '💗'];
      for (let i = 0; i < 16; i++) {
        const h = document.createElement("span");
        h.className = "floating-heart";
        h.textContent = icons[i % icons.length];
        h.style.left = `${(i * 6.2) % 96}%`;
        h.style.fontSize = `${14 + (i % 4) * 3}px`;
        h.style.animationDuration = `${8 + (i % 5) * 2}s`;
        h.style.animationDelay = `-${(i * 1.1) % 8}s`;
        layer.appendChild(h);
      }
    }

    // 4. Thông báo nhắc điểm danh khi bật/kết nối Wi-Fi lần đầu tiên trong ngày
    const FIRST_WIFI_DAY_KEY = 'dw_first_wifi_remind_day';

    async function remindFirstDailyWifi() {
      const { dateString, displayDate } = getMonthContext();
      if (!navigator.onLine || localStorage.getItem(FIRST_WIFI_DAY_KEY) === dateString) return;
      localStorage.setItem(FIRST_WIFI_DAY_KEY, dateString);

      const msg = `Chào ngày mới ${displayDate}! Bạn vừa mở Wi-Fi lần đầu hôm nay — vào điểm danh và nhận lời chúc nhé ♡`;
      const banner = document.getElementById("dailyAlertBanner");
      const alertText = document.getElementById("dailyAlertText");
      if (banner && alertText) {
        alertText.textContent = msg;
        banner.classList.add("show");
      }

      if ('Notification' in window) {
        try {
          if (Notification.permission === 'default') {
            await Notification.requestPermission();
          }
          if (Notification.permission === 'granted') {
            new Notification('Daily Wishes ♡', { body: msg });
          }
        } catch (_) {}
      }
    }

    const dismissAlertBtn = document.getElementById("dismissAlertBtn");
    if (dismissAlertBtn) {
      dismissAlertBtn.onclick = () => {
        const banner = document.getElementById("dailyAlertBanner");
        if (banner) banner.classList.remove("show");
      };
    }

    window.addEventListener('online', remindFirstDailyWifi);

    // Random ngày mở vòng quay trong khoảng [27 .. ngày cuối tháng] cho từng tháng
    const MONTH_TRACKER_KEY = 'dw_active_month_key';
    const RANDOM_UNLOCK_DAY_KEY = 'dw_random_wheel_unlock_day';
    const SPIN_USED_MONTH_KEY = 'dw_month_spin_used';

    let currentWheelAngle = 0;
    let isSpinningWheel = false;

    function getRandomUnlockDayForMonth(monthKey, daysInMonth) {
      const startDay = Math.min(27, daysInMonth);
      const saved = readJsonSafe(RANDOM_UNLOCK_DAY_KEY, {});
      if (
        saved &&
        saved.monthKey === monthKey &&
        Number.isInteger(saved.unlockDay) &&
        saved.unlockDay >= startDay &&
        saved.unlockDay <= daysInMonth
      ) {
        return saved.unlockDay;
      }

      const randomDay = startDay + Math.floor(Math.random() * (daysInMonth - startDay + 1));
      writeJsonSafe(RANDOM_UNLOCK_DAY_KEY, { monthKey, unlockDay: randomDay });
      return randomDay;
    }

    function checkAndResetMonthlyCycle(ctx) {
      const monthKey = ctx.monthPrefix.slice(0, 7);
      const savedMonth = localStorage.getItem(MONTH_TRACKER_KEY);

      if (savedMonth && savedMonth !== monthKey) {
        localStorage.removeItem(`daily_wishes_attendance_${savedMonth.replace('-', '_')}`);
        localStorage.removeItem(SPIN_USED_MONTH_KEY);
        localStorage.removeItem(RANDOM_UNLOCK_DAY_KEY);
      }
      localStorage.setItem(MONTH_TRACKER_KEY, monthKey);
      const unlockDay = getRandomUnlockDayForMonth(monthKey, ctx.daysInMonth);
      return { monthKey, unlockDay };
    }

    function syncCheckInBtnState(checkedToday) {
      const checkInBtn = document.getElementById("checkInBtn");
      if (!checkInBtn) return;
      checkInBtn.disabled = checkedToday;
      checkInBtn.textContent = checkedToday ? "Đã điểm danh hôm nay ✓" : "Điểm danh hôm nay ✓";
    }

    function updateEndOfMonthRewardUI(totalChecked, daysInMonth) {
      const totalEl = document.getElementById("totalDaysInMonth");
      const streakEl = document.getElementById("streakCount");
      const rewardBtn = document.getElementById("claimRewardBtn");
      const spinBtn = document.getElementById("spinRewardBtn");
      const resultEl = document.getElementById("rewardResultText");

      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const unlockDay = getRandomUnlockDayForMonth(monthKey, daysInMonth);
      const isWheelUnlocked = now.getDate() >= unlockDay || totalChecked >= daysInMonth;
      const alreadySpunThisMonth = localStorage.getItem(SPIN_USED_MONTH_KEY) === monthKey;

      if (totalEl) totalEl.textContent = daysInMonth;
      if (streakEl) streakEl.textContent = totalChecked;

      if (rewardBtn) {
        rewardBtn.style.display = isWheelUnlocked ? "inline-block" : "none";
        rewardBtn.textContent = alreadySpunThisMonth ? "Đã quay tháng này 🎁" : "Vòng quay cuối tháng 🎡";
      }

      if (spinBtn && resultEl) {
        if (alreadySpunThisMonth) {
          spinBtn.disabled = true;
          spinBtn.textContent = "Đã nhận quà tháng này";
          const savedPrize = localStorage.getItem(`dw_month_prize_${monthKey}`);
          if (savedPrize) {
            resultEl.textContent = `Quà tháng này của bạn: ${savedPrize}`;
          }
        } else {
          spinBtn.disabled = false;
          spinBtn.textContent = "Quay ngay";
        }
      }
    }

    function renderAttendanceCount(totalChecked, daysInMonth) {
      updateEndOfMonthRewardUI(totalChecked, daysInMonth);
    }

    function readLocalAttendance(localKey) {
      try {
        const parsed = JSON.parse(localStorage.getItem(localKey) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function writeLocalAttendance(localKey, dates) {
      try {
        localStorage.setItem(localKey, JSON.stringify(dates));
      } catch (_) {}
    }

    async function syncAttendanceFromCloud(localDates, ctx) {
      const { data, error } = await supabase.from('attendance').select('*');
      if (error || !Array.isArray(data)) return localDates;

      const cloudDates = data
        .map((item) => String(item.visit_date || item.date || '').slice(0, 10))
        .filter((d) => d.startsWith(ctx.monthPrefix));

      const merged = Array.from(new Set([...localDates, ...cloudDates]));
      writeLocalAttendance(ctx.localKey, merged);
      renderAttendanceCount(merged.length, ctx.daysInMonth);
      syncCheckInBtnState(merged.includes(ctx.dateString));
      return merged;
    }

    // Chỉ tải & hiển thị trạng thái hiện tại khi vào trang, không tự điểm danh
    async function initAttendanceDisplay() {
      const ctx = getMonthContext();
      checkAndResetMonthlyCycle(ctx);

      const statusEl = document.getElementById("attendanceTodayStatus");
      let localDates = readLocalAttendance(ctx.localKey);
      const alreadyToday = localDates.includes(ctx.dateString);

      renderAttendanceCount(localDates.length, ctx.daysInMonth);
      syncCheckInBtnState(alreadyToday);
      if (statusEl) {
        statusEl.textContent = alreadyToday
          ? `Đã điểm danh ngày ${ctx.displayDate} ✓`
          : `Hôm nay (${ctx.displayDate}) chưa điểm danh — bấm nút để điểm danh nhé.`;
      }

      try {
        localDates = await syncAttendanceFromCloud(localDates, ctx);
        const checkedAfterSync = localDates.includes(ctx.dateString);
        syncCheckInBtnState(checkedAfterSync);
        if (statusEl) {
          statusEl.textContent = checkedAfterSync
            ? `Đã đồng bộ điểm danh ngày ${ctx.displayDate} ✓`
            : `Hôm nay (${ctx.displayDate}) chưa điểm danh — bấm nút để điểm danh nhé.`;
        }
      } catch (_) {}
    }

    // Chỉ khi bấm nút mới thực hiện điểm danh cho hôm nay
    async function handleManualCheckIn() {
      const ctx = getMonthContext();
      checkAndResetMonthlyCycle(ctx);

      const statusEl = document.getElementById("attendanceTodayStatus");
      let localDates = readLocalAttendance(ctx.localKey);

      if (localDates.includes(ctx.dateString)) {
        syncCheckInBtnState(true);
        if (statusEl) statusEl.textContent = `Đã điểm danh ngày ${ctx.displayDate} rồi nhé ✓`;
        return;
      }

      localDates.push(ctx.dateString);
      writeLocalAttendance(ctx.localKey, localDates);
      renderAttendanceCount(localDates.length, ctx.daysInMonth);
      syncCheckInBtnState(true);

      try {
        const { data: existingRows, error: checkError } = await supabase
          .from('attendance')
          .select('visit_date')
          .eq('visit_date', ctx.dateString);

        if (checkError) {
          if (statusEl) statusEl.textContent = `Đã điểm danh ngày ${ctx.displayDate} (lưu tạm trên máy).`;
          return;
        }

        if (!existingRows || existingRows.length === 0) {
          const { error: insertError } = await supabase
            .from('attendance')
            .insert([{ visit_date: ctx.dateString, visited_at: ctx.timeString }]);
          if (insertError) {
            if (statusEl) statusEl.textContent = `Đã điểm danh ngày ${ctx.displayDate} (lưu tạm trên máy).`;
            return;
          }
        }

        await syncAttendanceFromCloud(localDates, ctx);
        if (statusEl) statusEl.textContent = `Đã điểm danh & đồng bộ ngày ${ctx.displayDate} ✓`;
      } catch (_) {
        if (statusEl) statusEl.textContent = `Đã điểm danh ngày ${ctx.displayDate} (lưu tạm trên máy).`;
      }
    }

    const checkInBtn = document.getElementById("checkInBtn");
    if (checkInBtn) {
      checkInBtn.onclick = handleManualCheckIn;
    }

    function renderPlans(weeklyPlans) {
      const listEl = document.getElementById("planList");
      if (!listEl) return;
      listEl.replaceChildren();

      if (!weeklyPlans.length) {
        listEl.innerHTML = `<div style="font-size:11px; color:#b895a5; text-align:center; padding:10px;">Chưa có kế hoạch nào.</div>`;
        return;
      }

      weeklyPlans.forEach((plan) => {
        const item = document.createElement("div");
        item.className = `plan-item ${plan.done ? 'completed' : ''}`;

        const titleSpan = document.createElement("span");
        titleSpan.innerHTML = escapeHtml(plan.title);

        const checkBtn = document.createElement("button");
        checkBtn.className = "secondary";
        checkBtn.textContent = plan.done ? "Bỏ qua" : "Xong";
        checkBtn.onclick = async () => {
          await supabase.from('weekly_plans').update({ done: !plan.done }).eq('id', plan.id);
          await loadPlans();
        };

        item.appendChild(titleSpan);
        item.appendChild(checkBtn);
        listEl.appendChild(item);
      });
    }

    async function loadPlans() {
      try {
        const { data, error } = await supabase
          .from('weekly_plans')
          .select('*')
          .order('id', { ascending: true });
        if (!error) renderPlans(data || []);
      } catch (_) {
        renderPlans([]);
      }
    }

    const addPlanBtn = document.getElementById("addPlanBtn");
    if (addPlanBtn) {
      addPlanBtn.onclick = async () => {
        const input = document.getElementById("planTitleInput");
        const val = input ? input.value.trim() : "";
        if (!val) return;
        const { error } = await supabase.from('weekly_plans').insert([{ title: val, done: false }]);
        if (!error && input) {
          input.value = "";
          await loadPlans();
        }
      };
    }

    const sendAdminBtn = document.getElementById("sendAdminBtn");
    if (sendAdminBtn) {
      sendAdminBtn.onclick = async () => {
        const noteInput = document.getElementById("wishNoteInput");
        const note = noteInput ? noteInput.value.trim() : "";
        if (!note) {
          alert("Vui lòng nhập nội dung!");
          return;
        }

        const { error } = await supabase.from('notes').insert([
          { content: note, created_at: new Date().toISOString() }
        ]);

        if (error) {
          alert("Gửi thất bại, kiểm tra lại kết nối!");
        } else {
          alert("Đã gửi tâm sự thành công! ♡");
          if (noteInput) noteInput.value = "";
        }
      };
    }

    function setupRealtimeSync() {
      const ctx = getMonthContext();
      supabase
        .channel('daily-wishes-index-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'weekly_plans' }, () => {
          loadPlans();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, async () => {
          const localDates = readLocalAttendance(ctx.localKey);
          await syncAttendanceFromCloud(localDates, ctx);
        })
        .subscribe();
    }

    const rewardModal = document.getElementById("rewardModal");
    const claimRewardBtn = document.getElementById("claimRewardBtn");
    const closeRewardBtn = document.getElementById("closeRewardBtn");
    const spinRewardBtn = document.getElementById("spinRewardBtn");
    const wheelDisc = document.getElementById("wheelDisc");

    if (claimRewardBtn && rewardModal) {
      claimRewardBtn.onclick = () => {
        const ctx = getMonthContext();
        const localDates = readLocalAttendance(ctx.localKey);
        updateEndOfMonthRewardUI(localDates.length, ctx.daysInMonth);
        rewardModal.classList.add("open");
      };
    }

    if (closeRewardBtn && rewardModal) {
      closeRewardBtn.onclick = () => rewardModal.classList.remove("open");
    }

    if (spinRewardBtn) {
      spinRewardBtn.onclick = () => {
        if (isSpinningWheel) return;
        const now = new Date();
        const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        if (localStorage.getItem(SPIN_USED_MONTH_KEY) === monthKey) return;

        isSpinningWheel = true;
        spinRewardBtn.disabled = true;

        const sliceIndex = Math.floor(Math.random() * rewardsPool.length);
        const picked = rewardsPool[sliceIndex];
        const sliceDeg = 360 / rewardsPool.length;
        const targetAngle = currentWheelAngle + 360 * 5 + (360 - (sliceIndex * sliceDeg + sliceDeg / 2));
        currentWheelAngle = targetAngle;

        if (wheelDisc) {
          wheelDisc.style.transform = `rotate(${currentWheelAngle}deg)`;
        }

        const resultEl = document.getElementById("rewardResultText");
        if (resultEl) resultEl.textContent = "Vòng quay đang chạy...";

        setTimeout(() => {
          localStorage.setItem(SPIN_USED_MONTH_KEY, monthKey);
          localStorage.setItem(`dw_month_prize_${monthKey}`, picked);
          if (resultEl) resultEl.textContent = `Phần thưởng tháng này của bạn: ${picked}`;
          spinRewardBtn.textContent = "Đã nhận quà tháng này";
          if (claimRewardBtn) claimRewardBtn.textContent = "Đã quay tháng này 🎁";
          isSpinningWheel = false;
        }, 2850);
      };
    }

    initHearts();
    showDailyWish();
    initAttendanceDisplay();
    loadPlans();
    setupRealtimeSync();

    const todayWishBtn = document.getElementById("todayWishBtn");
    const todayEl = document.getElementById("today");
    if (todayWishBtn) todayWishBtn.onclick = showDailyWish;
    if (todayEl) todayEl.textContent = new Date().toLocaleDateString("vi-VN");
  </script>
</body>
</html>
